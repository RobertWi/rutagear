android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m

# GitHub Packages credentials for pulling karoo-ext. Set these in
# your user-local ~/.gradle/gradle.properties (NOT in this file)
# so they never get committed:
#
#   gpr.user=<your-github-username>
#   gpr.key=<github-personal-access-token-with-read:packages-scope>
#
# Empty defaults so a fresh checkout still parses; the build will
# fail at dependency resolution if the user-local values aren't
# set, with a clear gradle error pointing at the io.hammerhead
# repository config.
gpr.user=
gpr.key=
