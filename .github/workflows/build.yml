# GitHub Actions build for rutagear. Mirrors the validate +
# build:apk stages from the GitLab pipeline this repo was
# originally developed under, minus the device-install step
# (you don't have a Karoo USB-attached to a GitHub runner).
#
# Artifacts: app-debug.apk attached to each successful run,
# downloadable for 14 days.
name: build-apk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check versionCode bumped if app/ changed
        shell: bash
        run: |
          set -eu
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "[bump] no parent commit, skipping"; exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "[bump] files changed:"; echo "$CHANGED" | sed 's/^/  - /'
          RELEVANT=$(echo "$CHANGED" | grep -E '^app/src/|^app/build\.gradle\.kts$|^app/src/main/AndroidManifest\.xml$' || true)
          if [ -z "$RELEVANT" ]; then echo "[bump] no app changes — skip"; exit 0; fi
          CUR=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          PREV=$(git show HEAD~1:app/build.gradle.kts | grep -E 'versionCode\s*=' | head -1 | grep -oE '[0-9]+')
          echo "[bump] prev=$PREV cur=$CUR"
          if [ -z "$CUR" ] || [ -z "$PREV" ]; then echo "[bump] couldn't parse"; exit 1; fi
          if [ "$CUR" -le "$PREV" ]; then echo "[bump] FAIL: bump versionCode"; exit 1; fi
          echo "[bump] OK"

  build:
    runs-on: ubuntu-latest
    needs: validate-version-bump
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      # karoo-ext is published to GitHub Packages under
      # hammerheadnav/karoo-ext. GitHub Packages Maven requires auth
      # even for public reads; the workflow's GITHUB_TOKEN with
      # packages:read works for public packages. If a cross-org read
      # ever fails, set repo secrets GPR_USER + GPR_KEY (a PAT with
      # read:packages) and they take precedence.
      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_gpr_user: ${{ secrets.GPR_USER || github.actor }}
          ORG_GRADLE_PROJECT_gpr_key: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rutagear-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
